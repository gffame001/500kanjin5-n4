<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কাঞ্জি কুইজ — N5–N4 (৫০০)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#eef1f6;
    color:#1f2937;
    font-family:'Noto Sans Bengali','Hind Siliguri','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 16px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:760px;
    background:#fff;
    border:1px solid #e4e8ef;
    border-radius:20px;
    padding:22px 22px 20px;
    box-shadow:0 12px 32px rgba(21,34,66,.07), 0 2px 6px rgba(21,34,66,.04);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
  }
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff3e0;color:#b45309;border:1px solid #ffd9a8;
    border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;
    white-space:nowrap;
  }
  .badge-ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;border-radius:5px;
    background:#f59e0b;color:#fff;font-size:11px;font-weight:700;
    font-family:'Noto Sans JP',sans-serif;
  }
  .progress{font-size:13px;font-weight:600;color:#6b7280;letter-spacing:.02em}

  /* Segmented Progress Bar (500 thin segments) */
  .progress-wrap{margin-top:14px}
  .segments{
    display:flex;
    gap:1px;
    height:9px;
    align-items:stretch;
  }
  .seg{
    flex:1 1 0;
    min-width:0;
    border-radius:1.5px;
    background:#e6eaf1;
    cursor:pointer;
    transition:background .18s ease, box-shadow .15s ease;
  }
  .seg:hover{box-shadow:0 0 0 1.5px #6366f1;z-index:2}
  .seg.now{
    background:#c7d2fe;
    box-shadow:0 0 0 1.5px #6366f1;
    animation:segPulse 1.5s ease-in-out infinite;
  }
  .seg.correct{background:#22c55e;box-shadow:none;animation:none}
  .seg.wrong{background:#ef4444;box-shadow:none;animation:none}
  @keyframes segPulse{
    0%,100%{opacity:1}
    50%{opacity:.45}
  }
  .progress-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:9px;
    font-size:12.5px;
    color:#64748b;
    flex-wrap:wrap;
  }
  .progress-meta .pm b{color:#111827;font-weight:700}
  .progress-meta .pills{display:inline-flex;gap:6px}
  .pill{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 9px;border-radius:999px;
    font-weight:700;font-size:12px;
  }
  .pill.ok{background:#e7f8ee;color:#15803d}
  .pill.no{background:#fdeaea;color:#b91c1c}

  .kanji{
    font-family:'Noto Sans JP','Yu Gothic','Hiragino Sans',serif;
    font-size:clamp(62px,16vw,104px);
    font-weight:700;
    line-height:1.05;
    letter-spacing:.04em;
    text-align:center;
    color:#111827;
    margin:26px 0 12px;
  }
  .question{
    text-align:center;
    color:#4b5563;
    font-size:16px;
    margin:0 0 20px;
  }

  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{
    position:relative;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    padding:14px 12px;
    border-radius:12px;
    border:1.6px solid;
    background:#fff;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, background .15s, border-color .15s;
    line-height:1.35;
  }
  .opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 16px rgba(21,34,66,.09)}
  .opt:active:not(:disabled){transform:translateY(0)}
  .opt:disabled{cursor:default;transform:none;box-shadow:none}
  .o0{background:#ecfaf1;border-color:#93d9b0;color:#186b41}
  .o1{background:#fff9e8;border-color:#f2d582;color:#8a6410}
  .o2{background:#fdeef0;border-color:#f2a9b2;color:#a13844}
  .o3{background:#eef1ff;border-color:#aebbf3;color:#37479e}
  .opt.correct{
    background:#d8f6e4;border-color:#22a45d;color:#0f6b3a;
    box-shadow:0 0 0 3px rgba(34,164,93,.16);
  }
  .opt.wrong{
    background:#fde4e4;border-color:#e04a4a;color:#9b1c1c;
  }
  .opt.dim{opacity:.5}
  .opt .mark{
    position:absolute;
    top:-9px;
    right:-9px;
    width:26px;height:26px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    color:#fff;
    line-height:1;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
    border:2px solid #fff;
    animation:pop .25s cubic-bezier(.2,1.4,.5,1);
  }
  .opt.correct .mark{display:flex;background:#16a34a}
  .opt.wrong .mark{display:flex;background:#dc2626}
  @keyframes pop{
    0%{transform:scale(0);opacity:0}
    100%{transform:scale(1);opacity:1}
  }

  .reveal{position:relative;margin-top:22px}
  .reveal.locked .detail,
  .reveal.locked .example{filter:blur(6px);pointer-events:none;user-select:none}
  .lock-chip{display:none}
  .reveal.locked .lock-chip{
    display:flex;position:absolute;inset:0;z-index:2;
    align-items:center;justify-content:center;
    font-size:13.5px;font-weight:600;color:#64748b;
  }
  .reveal.locked .lock-chip span{
    background:rgba(255,255,255,.86);
    border:1px solid #e2e8f0;
    padding:8px 16px;border-radius:999px;
    box-shadow:0 4px 12px rgba(21,34,66,.06);
  }
  .detail{
    border:1px solid #e8ecf2;
    border-radius:14px;
    background:#fcfdff;
    padding:14px 16px;
    display:flex;flex-direction:column;gap:10px;
    transition:filter .25s ease;
  }
  .row{display:flex;align-items:center;gap:10px;font-size:15px;flex-wrap:wrap;line-height:1.5}
  .row b{color:#111827;font-weight:700}
  .row .val{color:#374151}
  .ico{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:6px;
    background:#eef2f8;color:#475569;font-size:12px;font-weight:700;
    font-family:'Noto Sans JP',sans-serif;
  }
  .ico.check{background:#e4f7ec;color:#1e9e5a;font-size:13px}
  .spk{
    flex:none;width:22px;height:22px;padding:0;border:none;border-radius:6px;
    background:#eef2f8;color:#475569;font-size:11px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .spk:hover{background:#dde5f0}
  .example{
    margin-top:12px;
    background:#f7f8fa;
    border:1px solid #eceff4;
    border-radius:12px;
    padding:14px 16px;
    transition:filter .25s ease;
  }
  .example .jp{
    font-family:'Noto Sans JP',sans-serif;
    font-size:17px;color:#111827;margin-bottom:7px;line-height:1.6;
  }
  .example .roma{font-style:italic;color:#6b7280;font-size:13.5px;margin-bottom:6px}
  .example .bn{color:#374151;font-size:15px}

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:20px;
    align-items:stretch;
  }
  .nav-arrow{
    flex:0 0 58px;
    border-radius:14px;
    border:1.6px solid #e2e8f0;
    background:#f8fafc;
    color:#475569;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:inherit;
    line-height:1;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .nav-arrow:hover:not(:disabled){
    background:#eef2ff;
    border-color:#c7d2fe;
    color:#4f46e5;
    transform:translateY(-1px);
    box-shadow:0 6px 14px -6px rgba(99,102,241,.5);
  }
  .nav-arrow:active:not(:disabled){transform:translateY(0)}
  .nav-arrow:disabled{
    opacity:.35;
    cursor:not-allowed;
    background:#f1f5f9;
  }
  .nav-row .next{margin-top:0;flex:1}

  .next{
    position:relative;
    overflow:hidden;
    padding:16px 20px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#6366f1 0%, #8b5cf6 52%, #a855f7 100%);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:.015em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:
      0 8px 20px -6px rgba(99,102,241,.55),
      0 4px 10px -4px rgba(139,92,246,.40),
      inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s ease, filter .18s ease;
  }
  .next::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.30) 50%, transparent 70%);
    transform:translateX(-120%);
    transition:transform .55s ease;
    pointer-events:none;
  }
  .next:hover:not(:disabled)::before{transform:translateX(120%)}
  .next:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:
      0 14px 28px -8px rgba(99,102,241,.60),
      0 6px 14px -4px rgba(139,92,246,.45),
      inset 0 1px 0 rgba(255,255,255,.30);
  }
  .next:active:not(:disabled){transform:translateY(0);filter:brightness(.96)}
  .next:disabled{
    background:linear-gradient(135deg,#cbd5e1,#cbd5e1);
    color:#f8fafc;
    box-shadow:none;
    cursor:not-allowed;
    opacity:.85;
  }
  .next:disabled::before{display:none}
  .next .arrow{
    display:inline-block;
    font-size:18px;
    line-height:1;
    transition:transform .2s ease;
  }
  .next:hover:not(:disabled) .arrow{transform:translateX(4px)}
  .next:disabled .arrow{opacity:.6}
  .next .chip{
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.30);
    padding:1px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }
  .next:disabled .chip{background:rgba(255,255,255,.35);border-color:transparent;color:#64748b}

  .result{text-align:center;padding:34px 10px 20px}
  .result .emoji{font-size:52px;line-height:1}
  .result h2{margin:14px 0 8px;font-size:24px;color:#111827}
  .result .score{color:#4b5563;font-size:17px;margin:0 0 26px}
  .result .score b{color:#0f6b3a;font-size:22px}
  .result .next{margin-top:0;width:100%}

  @media (max-width:520px){
    .options{grid-template-columns:1fr}
    .card{padding:18px 16px 16px;border-radius:16px}
    body{padding:16px 12px 48px}
    .segments{gap:1px;height:8px}
    .progress-meta{font-size:12px}
    .nav-arrow{flex-basis:48px;font-size:17px;border-radius:12px}
  }
</style>
</head>

/* =========================================================
   Helpers
   ========================================================= */
const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
const bn = n => String(n).replace(/\d/g, d => BN_DIGITS[+d]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kanaOnly = s => String(s || '').replace(/\([^)]*\)/g, '').replace(/[-–—]/g, ' ').replace(/\s+/g, ' ').trim();

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

/* =========================================================
   State + localStorage
   ========================================================= */
const STORAGE_KEY = 'kanji_quiz_500_state_v1';
const card = document.getElementById('card');

let QUESTIONS = [];
let results   = [];
let selectedIdx = [];
let idx = 0, score = 0, answered = false;

function prepareQuestions(){
  QUESTIONS = shuffle(DATA).map(q => {
    const opts = shuffle(q.options);
    return Object.assign({}, q, {
      opts,
      correctIdx: opts.indexOf(q.correctOption)
    });
  });
  results     = new Array(QUESTIONS.length).fill(null);
  selectedIdx = new Array(QUESTIONS.length).fill(null);
  idx = 0;
  score = 0;
  answered = false;
}

/* Progress saved in localStorage; refreshed on every answer */
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      order: QUESTIONS.map(q => q.id),
      results, selectedIdx, idx, score
    }));
  }catch(e){}
}

function tryRestoreState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.order) || data.order.length !== DATA.length) return false;

    const byId = new Map(DATA.map(q => [q.id, q]));
    const ordered = [];
    for(const id of data.order){
      const src = byId.get(id);
      if(!src) return false;
      // re-shuffle options deterministically-ish per session; keep them stable by id order
      const opts = src.options.slice();
      // use the same shuffle as when stored? we don't store options order,
      // so we shuffle again but ensure correctIdx points to correctOption:
      const shuffled = shuffle(opts);
      ordered.push(Object.assign({}, src, {
        opts: shuffled,
        correctIdx: shuffled.indexOf(src.correctOption)
      }));
    }
    QUESTIONS = ordered;
    results     = data.results.slice();
    selectedIdx = data.selectedIdx.slice();
    idx         = Math.min(Math.max(0, data.idx | 0), QUESTIONS.length - 1);
    score       = data.score | 0;
    return true;
  }catch(e){ return false; }
}

function clearState(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

/* =========================================================
   Progress helpers
   ========================================================= */
function computeStats(){
  const attempted  = results.filter(r => r !== null).length;
  const correctCnt = results.filter(r => r === 'correct').length;
  const wrongCnt   = results.filter(r => r === 'wrong').length;
  const remaining  = QUESTIONS.length - attempted;
  return { attempted, correctCnt, wrongCnt, remaining };
}

function segmentsHTML(){
  return results.map((r, i) => {
    let cls = 'seg';
    if(r === 'correct')      cls += ' correct';
    else if(r === 'wrong')   cls += ' wrong';
    else if(i === idx)       cls += ' now';
    return `<i class="${cls}" data-idx="${i}" title="প্রশ্ন ${i + 1}"></i>`;
  }).join('');
}

function metaHTML(){
  const { attempted, correctCnt, wrongCnt, remaining } = computeStats();
  return `
    <span class="pm">সম্পন্ন <b id="stat-attempted">${bn(attempted)}</b> / ${bn(QUESTIONS.length)}</span>
    <span class="pm">বাকি <b id="stat-remaining">${bn(remaining)}</b></span>
    <span class="pills">
      <span class="pill ok">✓ <span id="stat-correct">${bn(correctCnt)}</span></span>
      <span class="pill no">✕ <span id="stat-wrong">${bn(wrongCnt)}</span></span>
    </span>
  `;
}

function refreshProgress(){
  const { attempted, correctCnt, wrongCnt, remaining } = computeStats();
  const $ = id => document.getElementById(id);
  if($('stat-attempted'))  $('stat-attempted').textContent  = bn(attempted);
  if($('stat-remaining'))  $('stat-remaining').textContent  = bn(remaining);
  if($('stat-correct'))    $('stat-correct').textContent    = bn(correctCnt);
  if($('stat-wrong'))      $('stat-wrong').textContent      = bn(wrongCnt);

  const segs = document.querySelectorAll('.seg');
  segs.forEach((seg, i) => {
    seg.classList.remove('now','correct','wrong');
    const r = results[i];
    if(r === 'correct')    seg.classList.add('correct');
    else if(r === 'wrong') seg.classList.add('wrong');
    else if(i === idx)     seg.classList.add('now');
  });
}

/* =========================================================
   Render
   ========================================================= */
function render(){
  const q = QUESTIONS[idx];
  const alreadyAnswered = results[idx] !== null;
  answered = alreadyAnswered;

  const isLast  = idx === QUESTIONS.length - 1;
  const isFirst = idx === 0;
  const nextLabel = isLast ? 'ফলাফল দেখুন' : 'পরবর্তী প্রশ্ন';

  card.innerHTML = `
    <div class="topbar">
      <span class="badge"><span class="badge-ico">漢</span> কাঞ্জি — N5–N4 (৫০০)</span>
      <span class="progress">প্রশ্ন ${bn(idx + 1)} / ${bn(QUESTIONS.length)}</span>
    </div>

    <div class="progress-wrap">
      <div class="segments" id="segments" aria-hidden="true">${segmentsHTML()}</div>
      <div class="progress-meta">${metaHTML()}</div>
    </div>

    <div class="kanji">${esc(q.kanji)}</div>
    <p class="question">এই কাঞ্জির অর্থ কী?</p>

    <div class="options" id="options">
      ${q.opts.map((opt, i) =>
        `<button class="opt o${i % 4}" data-i="${i}">${esc(opt)}<span class="mark"></span></button>`
      ).join('')}
    </div>

    <div class="reveal locked" id="reveal">
      <div class="lock-chip"><span>🔒 উত্তর নির্বাচন করলে তথ্য দেখা যাবে</span></div>
      <div class="detail">
        <div class="row">
          <span class="ico">漢</span><b>কাঞ্জি:</b><span class="val">${esc(q.kanji)}</span>
        </div>
        <div class="row">
          <button class="spk" data-say="${esc(kanaOnly(q.reading))}" title="উচ্চারণ শুনুন">🔊</button>
          <b>পড়া:</b><span class="val">${esc(q.reading)}</span>
        </div>
        <div class="row">
          <button class="spk" data-say="${esc(kanaOnly(q.onyomi))}" title="উচ্চারণ শুনুন">🔊</button>
          <b>অন্যোওমি:</b><span class="val">${esc(q.onyomi)}</span>
        </div>
        <div class="row">
          <button class="spk" data-say="${esc(kanaOnly(q.kunyomi))}" title="উচ্চারণ শুনুন">🔊</button>
          <b>কুন্যোওমি:</b><span class="val">${esc(q.kunyomi)}</span>
        </div>
        <div class="row">
          <span class="ico check">✓</span><b>অর্থ:</b><span class="val">${esc(q.meaning)}</span>
        </div>
      </div>
      <div class="example">
        <div class="jp">${esc(q.exampleJp)}</div>
        <div class="roma">${esc(q.exampleRoma)}</div>
        <div class="bn">${esc(q.exampleBn)}</div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-arrow" id="prev" title="আগের প্রশ্ন" ${isFirst ? 'disabled' : ''} aria-label="আগের প্রশ্ন">◀</button>

      <button class="next" id="next" ${alreadyAnswered ? '' : 'disabled'}>
        <span>${nextLabel}</span>
        ${isLast ? '' : `<span class="chip">${bn(idx + 2)}/${bn(QUESTIONS.length)}</span>`}
        <span class="arrow">→</span>
      </button>

      <button class="nav-arrow" id="skipNext" title="উত্তর না দিয়ে পরের প্রশ্ন" ${isLast ? 'disabled' : ''} aria-label="পরের প্রশ্ন">▶</button>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => choose(+btn.dataset.i));
  });
  document.querySelectorAll('.spk').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      speak(btn.dataset.say);
    });
  });

  document.getElementById('prev').addEventListener('click', goPrev);
  document.getElementById('skipNext').addEventListener('click', goNext);
  document.getElementById('next').addEventListener('click', nextQuestion);

  document.getElementById('segments').addEventListener('click', e => {
    const seg = e.target.closest('.seg');
    if(seg) jumpTo(+seg.dataset.idx);
  });

  if(alreadyAnswered){
    restoreAnsweredState(q);
  }
}

function restoreAnsweredState(q){
  const userIdx = selectedIdx[idx];
  const correctIdx = q.correctIdx;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.disabled = true;
    const mark = btn.querySelector('.mark');
    if(bi === correctIdx){
      btn.classList.add('correct');
      mark.textContent = '✓';
    } else if(bi === userIdx){
      btn.classList.add('wrong');
      mark.textContent = '✕';
    } else {
      btn.classList.add('dim');
    }
  });
  document.getElementById('reveal').classList.remove('locked');
}

/* =========================================================
   Answer handling
   ========================================================= */
function choose(i){
  if(answered) return;
  answered = true;

  const q = QUESTIONS[idx];
  const correctIdx = q.correctIdx;
  const isRight = i === correctIdx;
  if(isRight) score++;

  results[idx]     = isRight ? 'correct' : 'wrong';
  selectedIdx[idx] = i;

  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.disabled = true;
    const mark = btn.querySelector('.mark');
    if(bi === correctIdx){
      btn.classList.add('correct');
      mark.textContent = '✓';
      mark.setAttribute('aria-label', 'সঠিক উত্তর');
    } else if(bi === i){
      btn.classList.add('wrong');
      mark.textContent = '✕';
      mark.setAttribute('aria-label', 'ভুল উত্তর');
    } else {
      btn.classList.add('dim');
    }
  });

  document.getElementById('reveal').classList.remove('locked');
  const nextBtn = document.getElementById('next');
  nextBtn.disabled = false;
  refreshProgress();
  saveState();
}

/* =========================================================
   Navigation
   ========================================================= */
function goPrev(){
  if(idx > 0) jumpTo(idx - 1);
}
function goNext(){
  if(idx < QUESTIONS.length - 1) jumpTo(idx + 1);
}
function jumpTo(i){
  if(i < 0 || i >= QUESTIONS.length) return;
  idx = i;
  render();
  saveState();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextQuestion(){
  if(idx < QUESTIONS.length - 1){
    jumpTo(idx + 1);
  } else {
    showResult();
  }
}

/* =========================================================
   Result
   ========================================================= */
function showResult(){
  const total = QUESTIONS.length;
  const { correctCnt, wrongCnt, attempted } = computeStats();
  const pct = Math.round(score / total * 100);
  const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚';

  card.innerHTML = `
    <div class="result">
      <div class="emoji">${emoji}</div>
      <h2>কুইজ শেষ হয়েছে!</h2>
      <p class="score">আপনার স্কোর: <b>${bn(score)}</b> / ${bn(total)} &nbsp;(${bn(pct)}%)</p>
      <p class="score" style="font-size:14px;margin-top:-16px">
        <span class="pill ok">✓ ${bn(correctCnt)}</span>
        <span class="pill no" style="margin-left:6px">✕ ${bn(wrongCnt)}</span>
        <span class="pm" style="margin-left:10px">সম্পন্ন ${bn(attempted)} / ${bn(total)}</span>
      </p>
      <button class="next" id="restart">
        <span>আবার শুরু করুন (নতুন এলোমেলো ক্রম)</span>
        <span class="arrow">↻</span>
      </button>
    </div>
  `;
  document.getElementById('restart').addEventListener('click', () => {
    clearState();
    prepareQuestions();
    render();
    saveState();
  });
}

/* Keyboard: 1-4 = answer, Enter = next, ← / → = prev / next */
document.addEventListener('keydown', e => {
  if(e.key >= '1' && e.key <= '4'){
    const btn = document.querySelectorAll('.opt')[+e.key - 1];
    if(btn && !btn.disabled) btn.click();
  } else if(e.key === 'Enter'){
    const n = document.getElementById('next');
    if(n && !n.disabled) n.click();
  } else if(e.key === 'ArrowLeft'){
    const p = document.getElementById('prev');
    if(p && !p.disabled) p.click();
  } else if(e.key === 'ArrowRight'){
    const s = document.getElementById('skipNext');
    if(s && !s.disabled) s.click();
  }
});

/* Boot: restore prior session if any, else fresh shuffle */
if(!tryRestoreState()){
  prepareQuestions();
}
render();
</script>
</body>
</html>
